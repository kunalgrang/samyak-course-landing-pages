<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Samyak Computer Classes — CCC Mock Examination</title></head><body style="margin:0;background:#07152f;color:white;font-family:Arial,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px">Loading CCC Mock Examination…</div><script>
(async()=>{try{const files=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt'];let b64='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Could not load exam data.');b64+=(await r.text()).trim();}const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Please open the test in the latest Chrome, Edge or Safari.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('loading').innerHTML='<div><h2>Unable to load the mock test</h2><p>'+String(e.message||e)+'</p><p>Please use the latest Chrome or Edge browser.</p></div>';}})();
</script></body></html>
